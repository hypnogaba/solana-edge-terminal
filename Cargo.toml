[package]
name = "solana-edge-lab"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Measure and use the DoubleZero Edge Solana shred feed: shreds vs the public path, on one host and one clock"

[dependencies]
# Shred decoding, FEC reconstruction and deshredding into entries. Apache-2.0.
# We use its layers directly and supply our own packets: DoubleZero delivers
# shreds over a GRE tunnel where a normal UDP socket receives nothing.
solana-stream-sdk = "1.4.0"
# `agave-unstable-api` is what makes the shred module public; solana-stream-sdk
# enables it too, so this only names a feature already in the build.
solana-ledger = { version = "3.1", features = ["agave-unstable-api"] }
solana-entry = "3.1"

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# Same major as the transaction types the shred decoder yields, so a pool
# address compares against a transaction account key without a conversion.
solana-pubkey = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
# Only to build shreds for the round-trip test: entries in, shreds out, our
# pipeline back to entries. Same versions solana-ledger itself uses.
solana-keypair = "3.1"
solana-hash = "3.1"
solana-message = "3.1"
solana-signature = "3.0"
solana-transaction = "3.1"
